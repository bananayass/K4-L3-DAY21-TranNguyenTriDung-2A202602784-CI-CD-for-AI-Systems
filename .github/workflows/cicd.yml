name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - ".dvc/**"
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: UNIT TEST
  # ============================================================
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # ============================================================
  # JOB 2: TRAIN
  # ============================================================
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------
      # AWS authentication
      # STORAGE_CREDENTIALS format:
      #
      # {
      #   "aws_access_key_id": "...",
      #   "aws_secret_access_key": "..."
      # }
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(
              os.environ["STORAGE_CREDENTIALS"]
          )

          access_key = credentials.get(
              "aws_access_key_id"
          )
          secret_key = credentials.get(
              "aws_secret_access_key"
          )
          session_token = credentials.get(
              "aws_session_token"
          )

          if not access_key:
              raise SystemExit(
                  "Missing aws_access_key_id"
              )

          if not secret_key:
              raise SystemExit(
                  "Missing aws_secret_access_key"
              )

          print(f"::add-mask::{access_key}")
          print(f"::add-mask::{secret_key}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"AWS_ACCESS_KEY_ID={access_key}\n"
              )

              env_file.write(
                  f"AWS_SECRET_ACCESS_KEY={secret_key}\n"
              )

              env_file.write(
                  "AWS_DEFAULT_REGION=ap-southeast-2\n"
              )

              if session_token:
                  print(
                      f"::add-mask::{session_token}"
                  )

                  env_file.write(
                      f"AWS_SESSION_TOKEN={session_token}\n"
                  )

          print("AWS credentials configured.")
          PYEOF

      # ----------------------------------------------------------
      # Pull training data from S3 using DVC
      # ----------------------------------------------------------
      - name: Pull training data with DVC
        run: |
          dvc pull --remote labstore \
            data/train_batch1.csv.dvc \
            data/holdout.csv.dvc

      # ----------------------------------------------------------
      # Train model
      # ----------------------------------------------------------
      - name: Train model
        run: python src/train.py

      # ----------------------------------------------------------
      # Read F1 from outputs/report.json
      # ----------------------------------------------------------
      - name: Read F1 score
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import math
          import os

          with open(
              "outputs/report.json",
              encoding="utf-8"
          ) as report_file:
              report = json.load(report_file)

          f1 = float(report["f1_score"])

          if not math.isfinite(f1):
              raise SystemExit(
                  f"Invalid f1_score: {f1}"
              )

          if not 0.0 <= f1 <= 1.0:
              raise SystemExit(
                  f"f1_score outside [0,1]: {f1}"
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output_file:
              output_file.write(
                  f"f1={f1:.10f}\n"
              )

          print(
              f"Training f1_score: {f1:.4f}"
          )
          PYEOF

      # ----------------------------------------------------------
      # Upload trained model to S3
      #
      # s3://bucket/artifacts/current/model.joblib
      # ----------------------------------------------------------
      - name: Upload model to S3
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ[
              "ARTIFACT_BUCKET"
          ]

          key = (
              "artifacts/current/"
              "model.joblib"
          )

          s3 = boto3.client("s3")

          s3.upload_file(
              "models/model.joblib",
              bucket,
              key
          )

          print(
              f"Uploaded model to "
              f"s3://{bucket}/{key}"
          )
          PYEOF

      # ----------------------------------------------------------
      # Save report in GitHub Actions
      # ----------------------------------------------------------
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  # ============================================================
  # JOB 3: QUALITY GATE
  # ============================================================
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check F1 quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(
              os.environ["F1_SCORE"]
          )

          threshold = 0.65

          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: f1_score "
                  f"{f1:.4f} < "
                  f"{threshold:.2f}. "
                  f"Release blocked."
              )

          print(
              f"PASSED: f1_score "
              f"{f1:.4f} >= "
              f"{threshold:.2f}. "
              f"Deploying model."
          )
          PYEOF

  # ============================================================
  # JOB 4: RELEASE
  # ============================================================
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Restart service and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            sudo systemctl restart income-api

            sleep 5

            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/healthz

            echo
            echo "Health check passed."
