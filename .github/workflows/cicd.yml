name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - ".dvc/**"
      - "data/**.dvc"
      - "src/**.py"
      - "scripts/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: UNIT TEST
  # ============================================================
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # ============================================================
  # JOB 2: TRAIN
  # ============================================================
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(
              os.environ["STORAGE_CREDENTIALS"]
          )

          access_key = credentials.get(
              "aws_access_key_id"
          )

          secret_key = credentials.get(
              "aws_secret_access_key"
          )

          session_token = credentials.get(
              "aws_session_token"
          )

          if not access_key:
              raise SystemExit(
                  "Missing aws_access_key_id"
              )

          if not secret_key:
              raise SystemExit(
                  "Missing aws_secret_access_key"
              )

          print(f"::add-mask::{access_key}")
          print(f"::add-mask::{secret_key}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"AWS_ACCESS_KEY_ID={access_key}\n"
              )

              env_file.write(
                  f"AWS_SECRET_ACCESS_KEY={secret_key}\n"
              )

              env_file.write(
                  "AWS_DEFAULT_REGION=ap-southeast-2\n"
              )

              if session_token:
                  print(
                      f"::add-mask::{session_token}"
                  )

                  env_file.write(
                      f"AWS_SESSION_TOKEN={session_token}\n"
                  )

          print("AWS credentials configured.")
          PYEOF

      # ----------------------------------------------------------
      # DVC PULL
      # ----------------------------------------------------------
      - name: Pull training data with DVC
        run: |
          dvc pull --remote labstore \
            data/train_batch1.csv.dvc \
            data/holdout.csv.dvc

      # ----------------------------------------------------------
      # BONUS 1: DAGSHUB / REMOTE MLFLOW
      # ----------------------------------------------------------
      - name: Configure optional DagsHub tracking
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [[ -n "$DAGSHUB_USERNAME" && -n "$DAGSHUB_TOKEN" ]]; then

            echo "::add-mask::$DAGSHUB_TOKEN"

            {
              printf 'MLFLOW_TRACKING_URI=https://dagshub.com/%s.mlflow\n' "$GITHUB_REPOSITORY"
              printf 'MLFLOW_TRACKING_USERNAME=%s\n' "$DAGSHUB_USERNAME"
              printf 'MLFLOW_TRACKING_PASSWORD=%s\n' "$DAGSHUB_TOKEN"
            } >> "$GITHUB_ENV"

            echo "DagsHub MLflow tracking configured."

          elif [[ -z "$DAGSHUB_USERNAME" && -z "$DAGSHUB_TOKEN" ]]; then

            echo "DagsHub secrets are not configured; using local MLflow tracking."

          else

            echo "Set both DAGSHUB_USERNAME and DAGSHUB_TOKEN secrets." >&2
            exit 1

          fi

      # ----------------------------------------------------------
      # TRAIN MODEL
      # ----------------------------------------------------------
      - name: Train model
        run: python src/train.py

      # ----------------------------------------------------------
      # BONUS 3: METRICS / CONFUSION MATRIX
      # ----------------------------------------------------------
      - name: Print class metrics and confusion matrix
        run: cat outputs/detail.txt

      # ----------------------------------------------------------
      # SAVE CANDIDATE ARTIFACTS
      # ----------------------------------------------------------
      - name: Save candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            models/model.joblib
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # JOB 3: QUALITY GATE
  # ============================================================
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      # QUAN TRỌNG:
      # scripts/s3_client.py cần biến này khi Quality Gate chạy
      STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}

      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install S3 client
        run: pip install boto3

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(
              os.environ["STORAGE_CREDENTIALS"]
          )

          access_key = credentials.get(
              "aws_access_key_id"
          )

          secret_key = credentials.get(
              "aws_secret_access_key"
          )

          session_token = credentials.get(
              "aws_session_token"
          )

          if not access_key:
              raise SystemExit(
                  "Missing aws_access_key_id"
              )

          if not secret_key:
              raise SystemExit(
                  "Missing aws_secret_access_key"
              )

          print(f"::add-mask::{access_key}")
          print(f"::add-mask::{secret_key}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"AWS_ACCESS_KEY_ID={access_key}\n"
              )

              env_file.write(
                  f"AWS_SECRET_ACCESS_KEY={secret_key}\n"
              )

              env_file.write(
                  "AWS_DEFAULT_REGION=ap-southeast-2\n"
              )

              if session_token:
                  print(
                      f"::add-mask::{session_token}"
                  )

                  env_file.write(
                      f"AWS_SESSION_TOKEN={session_token}\n"
                  )

          print("AWS credentials configured.")
          PYEOF

      # ----------------------------------------------------------
      # DOWNLOAD CANDIDATE
      # ----------------------------------------------------------
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate

      # ----------------------------------------------------------
      # QUALITY GATE
      #
      # - F1 >= 0.65
      # - So sánh với model production trước đó
      # ----------------------------------------------------------
      - name: Check minimum F1 and rollback gate
        env:
          REPORT_PATH: candidate/outputs/report.json
        run: python -m scripts.check_quality_gate

  # ============================================================
  # JOB 4: RELEASE
  # ============================================================
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      # QUAN TRỌNG:
      # scripts/publish_artifacts.py / s3_client.py cần biến này
      STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}

      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install S3 client
        run: pip install boto3

      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = json.loads(
              os.environ["STORAGE_CREDENTIALS"]
          )

          access_key = credentials.get(
              "aws_access_key_id"
          )

          secret_key = credentials.get(
              "aws_secret_access_key"
          )

          session_token = credentials.get(
              "aws_session_token"
          )

          if not access_key:
              raise SystemExit(
                  "Missing aws_access_key_id"
              )

          if not secret_key:
              raise SystemExit(
                  "Missing aws_secret_access_key"
              )

          print(f"::add-mask::{access_key}")
          print(f"::add-mask::{secret_key}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"AWS_ACCESS_KEY_ID={access_key}\n"
              )

              env_file.write(
                  f"AWS_SECRET_ACCESS_KEY={secret_key}\n"
              )

              env_file.write(
                  "AWS_DEFAULT_REGION=ap-southeast-2\n"
              )

              if session_token:
                  print(
                      f"::add-mask::{session_token}"
                  )

                  env_file.write(
                      f"AWS_SESSION_TOKEN={session_token}\n"
                  )

          print("AWS credentials configured.")
          PYEOF

      # ----------------------------------------------------------
      # DOWNLOAD APPROVED ARTIFACTS
      # ----------------------------------------------------------
      - name: Download gate-approved artifacts
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate

      # ----------------------------------------------------------
      # UPDATE serve.py ON EC2
      # ----------------------------------------------------------
      - name: Update serving code on VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}/src
          strip_components: 1

      # ----------------------------------------------------------
      # PUBLISH MODEL + REPORT TO S3
      # ----------------------------------------------------------
      - name: Publish model bundle and current report to S3
        env:
          ARTIFACT_ROOT: candidate
        run: python -m scripts.publish_artifacts

      # ----------------------------------------------------------
      # RESTART FASTAPI
      # ----------------------------------------------------------
      - name: Restart service and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            sudo systemctl restart income-api

            sleep 5

            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8080/healthz

            echo
            echo "Health check passed."
